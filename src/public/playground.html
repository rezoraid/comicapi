<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>comic-api · playground</title>
<style>
:root{--bg:#f4f0e4;--ink:#000;--acc:#ffdd00;--ok:#34d27b;--warn:#ffab00;--bad:#ff4d4d;--skip:#c9c5b8;--b:2px solid #000;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.hide{display:none}
main{max-width:820px;margin:0 auto;padding:0 12px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -12px 16px;padding:10px 12px;background:var(--acc);border-bottom:var(--b)}
h1{margin:0;font:900 16px var(--mono);text-transform:uppercase}
h1 span{font-weight:400;text-transform:none}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border:var(--b);background:#fff;font:700 12px var(--mono)}
.pill i{width:9px;height:9px;border:2px solid #000;background:var(--skip)}
.pill.ok{background:var(--ok)}.pill.bad{background:var(--bad)}
.card{background:#fff;border:var(--b);box-shadow:3px 3px 0 #000;padding:14px;margin-bottom:16px}
h2{margin:-14px -14px 12px;padding:5px 14px;background:var(--acc);border-bottom:var(--b);font:800 12px var(--mono);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font:800 11px var(--mono);text-transform:uppercase}
input,select{display:block;width:100%;margin-top:3px;padding:7px 9px;font:600 14px var(--mono);background:#fff;border:var(--b);border-radius:0}
input:focus,select:focus{outline:none;background:var(--acc)}
button{font:800 12px var(--mono);text-transform:uppercase;padding:7px 12px;background:var(--acc);border:var(--b);border-radius:0;cursor:pointer;color:#000}
button:active:not(:disabled){transform:translate(2px,2px)}
button:disabled{background:var(--skip);cursor:wait}
button.ghost{background:#fff}.sm{padding:3px 8px;font-size:11px}
.chips,.actions{display:flex;flex-wrap:wrap;gap:8px}
.chips{margin-bottom:12px}
.chip{display:flex;align-items:center;gap:7px;text-transform:none;background:#fff}
.chip.on{background:#3d5afe;color:#fff}
.dot{width:11px;height:11px;border:2px solid #000;background:var(--skip);display:inline-block}
.dot.pass{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--bad)}.dot.run{background:var(--acc)}
.notice{padding:10px 12px;margin-bottom:16px;border:var(--b);background:var(--bad);color:#fff}
.notice b{display:block;font-family:var(--mono);text-transform:uppercase}.notice code{color:#000}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.verdict h3{margin:0;font:900 16px var(--mono);text-transform:uppercase}
.tag{padding:0 8px;font:800 11px var(--mono);text-transform:uppercase;background:var(--skip);border:2px solid #000}
.tag.pass{background:var(--ok)}.tag.warn{background:var(--warn)}.tag.fail{background:var(--bad)}.tag.run{background:var(--acc)}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 0;border-top:2px solid #000}
.ico{width:24px;height:24px;display:grid;place-items:center;font:900 13px var(--mono);background:var(--skip);border:2px solid #000}
.pass .ico{background:var(--ok)}.warn .ico{background:var(--warn)}.fail .ico{background:var(--bad)}.run .ico{background:var(--acc)}
.name{font:900 12px var(--mono);text-transform:uppercase}.name small{margin-left:6px;font-weight:400;text-transform:none;color:#555}
.ms{font:700 11px var(--mono);white-space:nowrap}
.note{color:#555;font-size:13px;word-break:break-word}
code{font:700 12px var(--mono);background:#fff3a0;border:1px solid #000;padding:0 4px;word-break:break-all}
.err{margin-top:6px;padding:8px 10px;background:#ffd6d6;border:var(--b)}.err b{font-family:var(--mono)}
.hint{margin-top:6px;padding:7px 10px;background:#d8dfff;border:var(--b);font-size:13px}
.issues{margin:6px 0 0;padding:0;list-style:none;font-size:13px}.issues .fail{color:#a10018}.issues .warn{color:#8a5a00}
#matrix{overflow-x:auto}
table{width:100%;min-width:460px;border-collapse:collapse;font-size:13px}
th,td{padding:5px;text-align:center;border:2px solid #000}
th{background:#000;color:#fff;font:800 11px var(--mono)}
td:first-child,th:first-child{text-align:left}
tr.pick{cursor:pointer}tr.on td{background:var(--acc)}
.empty{padding:14px;text-align:center;border:var(--b);border-style:dashed;background:var(--bg);color:#555}
summary{cursor:pointer;font:800 12px var(--mono);text-transform:uppercase}
details[open] summary{margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font:700 12px var(--mono)}
.st{padding:0 8px;background:var(--ok);border:2px solid #000}.st.bad{background:var(--bad)}
pre{margin:8px 0 0;padding:10px;background:#111;color:#f4f0e4;overflow:auto;max-height:60vh;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<main>
<header>
  <h1>comic-api <span>/ playground</span></h1>
  <span class="pill" id="dot"><i></i><b id="health">memeriksa…</b></span>
  <span class="sp"></span>
  <button class="ghost sm" id="cfgbtn">Pengaturan</button>
</header>

<section class="card hide" id="cfg">
  <h2>Pengaturan</h2>
  <div class="grid">
    <label>Server URL<input id="base" placeholder="https://server-kamu.com" autocomplete="off" autocapitalize="off"></label>
    <label>API key<input id="key" type="password" placeholder="x-api-key (opsional)" autocomplete="off"></label>
    <label>Kata kunci tes<input id="q" value="solo" autocomplete="off" autocapitalize="off"></label>
  </div>
</section>

<div id="notice"></div>

<section class="card">
  <h2>Scraper</h2>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button id="diag">Diagnosa scraper ini</button>
    <button class="ghost" id="all">Diagnosa semua</button>
    <button class="ghost" id="copy" disabled>Salin laporan</button>
  </div>
</section>

<section class="card hide" id="matrixbox">
  <h2>Ringkasan</h2>
  <div id="matrix"></div>
</section>

<section class="card" id="detail"><div class="empty">Pilih scraper lalu klik <b>Diagnosa</b>. Tiap langkah dites langsung ke situs sumber; kalau gagal kamu tahu di langkah mana, di file:baris mana, dan saran perbaikannya.</div></section>

<section class="card">
  <details id="manual">
    <summary>Coba manual (respons mentah)</summary>
    <div class="grid"><label>Endpoint<select id="ep"></select></label></div>
    <div class="grid" id="form" style="margin:10px 0"></div>
    <button id="run">Execute</button>
    <div id="res"></div>
  </details>
</section>
</main>

<script>
'use strict'
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const store = {
  get(k, d) { try { const v = localStorage.getItem('cp2.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('cp2.' + k, JSON.stringify(v)) } catch {} }
}

const STEPS = [
  ['search', 'Cari'], ['latest', 'Terbaru'], ['popular', 'Populer'], ['browse', 'Jelajah'],
  ['genres', 'Genre'], ['detail', 'Detail komik'], ['chapter', 'Baca chapter'], ['image', 'Gambar']
]
const NEEDS = { detail: ['slug'], chapter: ['slug', 'chapter'], image: ['image'] }
const LABEL = { pass: 'Lolos', warn: 'Peringatan', fail: 'Gagal', skip: 'Dilewati', run: 'Berjalan' }
const ICON = { pass: '✓', warn: '!', fail: '✕', skip: '–', run: '…' }
const VERDICT = { pass: 'Siap dipakai', warn: 'Jalan, ada peringatan', fail: 'Ada yang gagal', skip: 'Belum ada hasil' }

let sources = [], sel = store.get('src', ''), results = {}, busy = false
$('#base').value = store.get('base', location.origin === 'null' ? '' : location.origin)
$('#key').value = store.get('key', '')
$('#q').value = store.get('q', 'solo')

const baseUrl = () => ($('#base').value.trim() || (location.origin === 'null' ? '' : location.origin)).replace(/\/+$/, '')
const headers = () => { const k = $('#key').value.trim(); return k ? { 'x-api-key': k } : {} }

async function api(path, params = {}) {
  const base = baseUrl()
  if (!base) return { status: 0, ms: 0, err: 'Isi Server URL dulu' }
  const url = new URL(base + path)
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) url.searchParams.set(k, v)
  const ac = typeof AbortController === 'function' ? new AbortController() : null
  const timer = setTimeout(() => ac && ac.abort(), 30000)
  const t = performance.now()
  try {
    const r = await fetch(url, { headers: headers(), cache: 'no-store', signal: ac ? ac.signal : undefined })
    const text = await r.text()
    let json = null
    try { json = JSON.parse(text) } catch {}
    return { status: r.status, ms: performance.now() - t, text, json, url: url.href, cache: r.headers.get('x-cache') }
  } catch (e) {
    return { status: 0, ms: performance.now() - t, err: e && e.name === 'AbortError' ? 'TIMEOUT (30 dtk)' : (e && e.message) || 'gagal terhubung', url: url.href }
  } finally { clearTimeout(timer) }
}

const httpFail = r => {
  const er = r.json?.error
  const hint = r.status === 401 ? 'API key salah atau belum diisi (Pengaturan).' : r.status === 404 ? 'Endpoint diagnosa tidak ada. Pastikan PLAYGROUND tidak di-set false di server.' : r.status === 429 ? 'Kena rate limit, tunggu sebentar.' : !r.status ? 'Server tidak terjangkau. Cek Server URL dan koneksi.' : ''
  return { kind: r.status ? `HTTP ${r.status}` : 'JARINGAN', message: er?.message || r.err || `HTTP ${r.status}`, where: '', hint }
}

const verdictOf = rows => {
  const s = rows.map(r => r.status)
  return s.includes('fail') ? 'fail' : s.includes('warn') ? 'warn' : s.includes('pass') ? 'pass' : 'skip'
}

function renderChips() {
  $('#chips').innerHTML = sources.length
    ? sources.map(s => {
        const rows = Object.values(results[s.id] || {})
        return `<button class="chip${s.id === sel ? ' on' : ''}" data-src="${esc(s.id)}"><span class="dot ${rows.length ? verdictOf(rows) : ''}"></span>${esc(s.name || s.id)}</button>`
      }).join('')
    : '<div class="empty">Belum ada scraper terdeteksi.</div>'
}

function renderMatrix() {
  const ids = Object.keys(results)
  $('#matrixbox').classList.toggle('hide', ids.length < 2)
  if (ids.length < 2) return
  $('#matrix').innerHTML = `<table><tr><th>Scraper</th>${STEPS.map(([, n]) => `<th>${n}</th>`).join('')}</tr>` +
    ids.map(id => `<tr class="pick${id === sel ? ' on' : ''}" data-src="${esc(id)}"><td>${esc(id)}</td>${STEPS.map(([k]) => `<td><span class="dot ${results[id][k]?.status || ''}" title="${esc(LABEL[results[id][k]?.status] || '')}"></span></td>`).join('')}</tr>`).join('') + '</table>'
}

function stepRow([key, name], r) {
  if (!r) return `<div class="row"><span class="ico">–</span><div class="name">${name}<small>${key}</small></div><span class="ms"></span></div>`
  const e = r.error
  const sample = Array.isArray(r.sample) && r.sample[0]?.title !== undefined
    ? `<div class="note">contoh: ${r.sample.map(i => esc(i.title)).join(' · ')}</div>`
    : r.sample?.first ? `<div class="note">contoh: <code>${esc(r.sample.first)}</code></div>` : ''
  const body =
    (e ? `<div class="err"><b>${esc(e.kind)}</b> ${e.message === e.kind ? '' : esc(e.message)}${e.where ? `<div>lokasi: <code>${esc(e.where)}</code></div>` : ''}</div>${e.hint ? `<div class="hint"><b>Saran:</b> ${esc(e.hint)}</div>` : ''}` : '') +
    (r.issues?.length ? `<ul class="issues">${r.issues.map(i => `<li class="${i.level}">${i.level === 'fail' ? '✕' : '!'} ${esc(i.text)}</li>`).join('')}</ul>` : '') +
    (e || r.status === 'skip' ? '' : sample)
  return `<div class="row ${r.status}"><span class="ico">${ICON[r.status]}</span><div><div class="name">${name}<small>${key}</small></div>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}${body}</div><span class="ms">${r.ms != null ? Math.round(r.ms) + ' ms' : ''}</span></div>`
}

function renderDetail() {
  const rows = results[sel]
  if (!rows) return
  const list = Object.values(rows)
  const v = busy && list.some(r => r.status === 'run') ? 'run' : verdictOf(list)
  const c = k => list.filter(r => r.status === k).length
  $('#detail').innerHTML =
    `<div class="verdict"><h3>${esc(sel)}</h3><span class="tag ${v}">${v === 'run' ? 'Berjalan…' : VERDICT[v]}</span><span class="note">${c('pass')} lolos · ${c('warn')} peringatan · ${c('fail')} gagal · ${c('skip')} dilewati</span></div>` +
    STEPS.map(s => stepRow(s, rows[s[0]])).join('')
  $('#copy').disabled = false
}

function render() { renderChips(); renderMatrix(); renderDetail() }

async function diagSource(id) {
  const rows = (results[id] = {})
  const ctx = {}
  sel = id
  store.set('src', id)
  for (const [step] of STEPS) {
    const miss = (NEEDS[step] || []).find(k => !ctx[k])
    if (miss) { rows[step] = { status: 'skip', note: `dilewati: belum ada "${miss}" dari langkah sebelumnya` }; continue }
    rows[step] = { status: 'run', note: 'menguji…' }
    render()
    const r = await api(`/api/${encodeURIComponent(id)}/diagnose/${step}`, { q: $('#q').value.trim() || 'solo', slug: ctx.slug, chapter: ctx.chapter, url: ctx.image })
    const d = r.json?.ok ? r.json.data : null
    rows[step] = d || { status: 'fail', ms: r.ms, error: httpFail(r), issues: [] }
    for (const k of ['slug', 'chapter', 'image']) if (d?.next?.[k] && !ctx[k]) ctx[k] = d.next[k]
  }
  render()
}

async function runDiag(ids) {
  if (busy) return
  busy = true
  $('#diag').disabled = $('#all').disabled = true
  try { for (const id of ids) await diagSource(id) } finally { busy = false; $('#diag').disabled = $('#all').disabled = false; render() }
}

function report() {
  return Object.entries(results).map(([id, rows]) => {
    const lines = STEPS.map(([k]) => {
      const r = rows[k]
      if (!r) return ''
      const e = r.error
      return `${ICON[r.status]} ${k} ${r.ms != null ? Math.round(r.ms) + 'ms' : ''} ${r.note || ''}` +
        (e ? `\n    ${e.kind}: ${e.message}${e.where ? ' @ ' + e.where : ''}${e.hint ? '\n    saran: ' + e.hint : ''}` : '') +
        (r.issues || []).map(i => `\n    ${i.level === 'fail' ? 'x' : '!'} ${i.text}`).join('')
    })
    return `[${id}] ${VERDICT[verdictOf(Object.values(rows))]}\n` + lines.filter(Boolean).join('\n')
  }).join('\n\n')
}

$('#chips').onclick = $('#matrix').onclick = e => {
  const t = e.target.closest('[data-src]')
  if (!t) return
  sel = t.dataset.src
  store.set('src', sel)
  if (results[sel]) render()
  else { renderChips(); $('#detail').innerHTML = '<div class="empty">Klik <b>Diagnosa scraper ini</b> untuk mulai.</div>' }
}
$('#diag').onclick = () => (sel ? runDiag([sel]) : undefined)
$('#all').onclick = () => runDiag(sources.map(s => s.id))
$('#copy').onclick = () => {
  if (typeof navigator !== 'undefined' && navigator.clipboard) navigator.clipboard.writeText(report())
  $('#copy').textContent = 'Tersalin'
  setTimeout(() => ($('#copy').textContent = 'Salin laporan'), 1500)
}
$('#cfgbtn').onclick = () => $('#cfg').classList.toggle('hide')
for (const id of ['base', 'key', 'q']) $('#' + id).oninput = () => store.set(id, $('#' + id).value)

/* coba manual */
const EP = {
  search: ['/api/{src}/search', ['q', 'limit']],
  latest: ['/api/{src}/latest', ['page']],
  popular: ['/api/{src}/popular', ['limit']],
  browse: ['/api/{src}/browse', ['q', 'genre', 'type', 'status', 'sort', 'page']],
  genres: ['/api/{src}/genres', []],
  comic: ['/api/{src}/comic/{slug}', ['slug']],
  chapter: ['/api/{src}/chapter/{slug}/{chapter}', ['slug', 'chapter']],
  'search-all': ['/api/search', ['q', 'limit']],
  sources: ['/api/sources', []],
  health: ['/health', []]
}
const DEF = { q: 'solo', limit: '10', page: '1' }
let ep = store.get('ep', 'search'), vals = store.get('vals', {})
if (!EP[ep]) ep = 'search'

function renderForm() {
  $('#ep').innerHTML = Object.keys(EP).map(k => `<option${k === ep ? ' selected' : ''}>${k}</option>`).join('')
  $('#form').innerHTML = EP[ep][1].map(k => `<label>${k}<input data-k="${k}" value="${esc(vals[k] ?? DEF[k] ?? '')}" autocomplete="off" autocapitalize="off"></label>`).join('') || '<div class="note">Tanpa parameter.</div>'
}
$('#ep').onchange = e => { ep = e.target.value; store.set('ep', ep); renderForm() }
$('#form').oninput = e => { const k = e.target.dataset.k; if (k) { vals[k] = e.target.value; store.set('vals', vals) } }

$('#run').onclick = async () => {
  let path = EP[ep][0].replace('{src}', encodeURIComponent(sel))
  const q = {}
  for (const k of EP[ep][1]) {
    const v = String(vals[k] ?? DEF[k] ?? '').trim()
    if (path.includes(`{${k}}`)) path = path.replace(`{${k}}`, encodeURIComponent(v))
    else q[k] = v
  }
  $('#run').disabled = true
  const r = await api(path, q)
  $('#run').disabled = false
  let out = r.text || ''
  try { out = JSON.stringify(JSON.parse(out), null, 2) } catch {}
  if (out.length > 100000) out = out.slice(0, 100000) + '\n… (dipotong)'
  const ok = r.status >= 200 && r.status < 300
  $('#res').innerHTML = `<div class="bar"><span class="st${ok ? '' : ' bad'}">${r.status || 'ERR'}</span><b>${Math.round(r.ms)} ms</b>${r.cache ? `<span>${esc(r.cache)}</span>` : ''}<code>${esc(r.url || '')}</code></div>` +
    (r.err ? `<div class="err"><b>${esc(r.err)}</b></div>` : `<pre>${esc(out)}</pre>`)
}

async function init() {
  renderForm()
  const [h, s] = await Promise.all([api('/health'), api('/api/sources')])
  const up = h.json?.ok
  $('#dot').className = 'pill ' + (up ? 'ok' : 'bad')
  $('#health').textContent = up ? `online · ${h.json.data.uptime}s` : h.status ? `error ${h.status}` : 'offline'
  if (!up) $('#cfg').classList.remove('hide')
  if (s.status === 401) {
    $('#cfg').classList.remove('hide')
    $('#notice').innerHTML = '<div class="notice"><b>API key salah atau belum diisi</b>Isi di Pengaturan lalu muat ulang halaman.</div>'
  }
  sources = s.json?.data?.items || []
  const broken = s.json?.data?.broken || []
  if (broken.length) {
    $('#notice').innerHTML = `<div class="notice"><b>${broken.length} file scraper gagal dimuat</b>${broken.map(b => `<div><code>${esc(b.file)}</code> ${esc(b.error)}${b.where ? ` <code>${esc(b.where)}</code>` : ''}</div>`).join('')}</div>`
  }
  if (!sources.some(x => x.id === sel)) sel = sources[0]?.id || ''
  render()
}
init()
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>comic-api playground</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#111;--soft:#f2f2f2;--ok:#0a7a2f;--bad:#c4161c;--skip:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#eee;--mut:#999;--line:#eee;--soft:#1b1b1b;--ok:#4ade80;--bad:#f87171;--skip:#fbbf24}}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
main{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
#dot{width:12px;height:12px;border:2px solid var(--line);margin-left:auto;background:var(--soft)}
#dot.ok{background:var(--ok)}#dot.bad{background:var(--bad)}
.box{border:2px solid var(--line);padding:10px;margin-bottom:12px}
.box>h2{font-size:12px;margin:-10px -10px 10px;padding:4px 10px;background:var(--fg);color:var(--bg);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
input,select{display:block;width:100%;margin-top:3px;padding:8px;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--line)}
input:focus,select:focus{outline:3px solid var(--mut);outline-offset:0}
button{font:inherit;font-size:13px;font-weight:700;padding:9px 14px;color:var(--bg);background:var(--fg);border:2px solid var(--line);cursor:pointer;text-transform:uppercase}
button.alt{color:var(--fg);background:var(--bg)}
button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:wait}
.mini{padding:2px 8px;font-size:11px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.st{padding:1px 8px;color:#fff;font-weight:700;background:var(--ok)}.st.bad{background:var(--bad)}
.url{flex-basis:100%;color:var(--mut);font-size:12px;word-break:break-all}
table{width:100%;border-collapse:collapse;margin:6px 0 10px}
td,th{padding:5px 6px;border:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:var(--soft);font-size:11px;text-transform:uppercase}
td.ms{white-space:nowrap;color:var(--mut)}td.r{white-space:nowrap;font-weight:700;width:1%}
.ok{color:var(--ok)}.bad{color:var(--bad)}.skip{color:var(--skip)}
.sum{font-weight:700;padding:8px;border:2px solid var(--line);margin-bottom:8px}
.sum.ok{border-color:var(--ok)}.sum.bad{border-color:var(--bad)}
pre{margin:0;padding:10px;background:var(--soft);border:1px solid var(--line);overflow:auto;max-height:65vh;font:12px/1.5 inherit;white-space:pre-wrap;word-break:break-word}
.tabs{display:flex;gap:0;margin-bottom:8px}.tabs button{border-right-width:0}.tabs button:last-child{border-right-width:2px}
.item{display:flex;gap:10px;padding:6px;border:1px solid var(--line);margin-bottom:-1px;cursor:pointer;align-items:center}
.item:hover{background:var(--soft)}
.item img,.item i{width:40px;height:56px;object-fit:cover;background:var(--soft);flex:none}
.item div{min-width:0}.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small,.muted{color:var(--mut);font-size:12px}
.chs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chs button{padding:3px 8px;font-size:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--soft);border:3px solid var(--line)}
.thumbs img.ok{border-color:var(--ok)}.thumbs img.bad{border-color:var(--bad)}
.head{display:flex;gap:10px}.head img{width:90px;height:128px;object-fit:cover;background:var(--soft);flex:none}
.head h3{margin:0 0 4px;font-size:15px}
</style>
</head>
<body>
<main>
<h1>comic-api / playground <span id="dot" title="health"></span></h1>

<section class="box">
  <h2>Server</h2>
  <div class="grid">
    <label>Server URL<input id="base" placeholder="https://server-kamu.com" autocomplete="off" autocapitalize="off"></label>
    <label>API key<input id="key" type="password" placeholder="x-api-key (opsional)" autocomplete="off"></label>
    <label>Kata kunci tes<input id="q" value="solo" autocomplete="off" autocapitalize="off"></label>
  </div>
</section>

<section class="box">
  <h2>1 · Tes otomatis</h2>
  <button id="all">Tes semua endpoint</button>
  <div id="tests"></div>
</section>

<section class="box">
  <h2>2 · Coba manual</h2>
  <div class="grid">
    <label>Sumber<select id="src"></select></label>
    <label>Endpoint<select id="ep"></select></label>
  </div>
  <div class="grid" id="form" style="margin:8px 0"></div>
  <button id="run">Execute</button>
</section>

<section class="box" id="res" hidden></section>
</main>

<script>
'use strict'
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const store = {
  get(k, d) { try { const v = localStorage.getItem('cp.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('cp.' + k, JSON.stringify(v)) } catch {} }
}

const F = {
  q: { label: 'q', def: 'solo' },
  limit: { label: 'limit', def: '10' },
  page: { label: 'page', def: '1' },
  period: { label: 'period', ph: 'weekly | monthly | alltime' },
  genre: { label: 'genre (pisah koma)', ph: 'action,fantasy' },
  type: { label: 'type', sel: 'types' },
  status: { label: 'status', sel: 'statuses' },
  sort: { label: 'sort', sel: 'sorts' },
  min: { label: 'min chapter' },
  slug: { label: 'slug *', req: 1 },
  chapter: { label: 'chapter *', req: 1 },
  url: { label: 'url gambar *', req: 1 }
}
const EP = {
  search: { path: '/api/{src}/search', f: ['q', 'limit'], scoped: 1 },
  latest: { path: '/api/{src}/latest', f: ['page'], scoped: 1 },
  popular: { path: '/api/{src}/popular', f: ['period', 'limit'], scoped: 1 },
  browse: { path: '/api/{src}/browse', f: ['q', 'genre', 'type', 'status', 'sort', 'min', 'page'], scoped: 1 },
  genres: { path: '/api/{src}/genres', f: [], scoped: 1 },
  comic: { path: '/api/{src}/comic/{slug}', f: ['slug'], scoped: 1 },
  chapter: { path: '/api/{src}/chapter/{slug}/{chapter}', f: ['slug', 'chapter'], scoped: 1 },
  'search-all': { path: '/api/search', f: ['q', 'limit'] },
  image: { path: '/api/image', f: ['url'] },
  sources: { path: '/api/sources', f: [] },
  health: { path: '/health', f: [] }
}

let sources = [], src = store.get('src', ''), ep = store.get('ep', 'search'), vals = store.get('vals', {}), view = 'preview', last = null
$('#base').value = store.get('base', location.origin === 'null' ? '' : location.origin)
$('#key').value = store.get('key', '')
$('#q').value = store.get('q', 'solo')
if (!EP[ep]) ep = 'search'

const baseUrl = () => ($('#base').value.trim() || (location.origin === 'null' ? '' : location.origin)).replace(/\/+$/, '')
const hdr = () => { const k = $('#key').value.trim(); return k ? { 'x-api-key': k } : {} }
const testQ = () => $('#q').value.trim() || 'solo'
const filters = () => sources.find(s => s.id === src)?.filters || {}

async function call(path, q = {}) {
  const base = baseUrl()
  if (!base) throw new Error('Isi Server URL dulu')
  const url = new URL(base + path)
  for (const [k, v] of Object.entries(q)) if (v !== '' && v != null) url.searchParams.set(k, v)
  const t = performance.now()
  let r, text
  try {
    r = await fetch(url, { headers: hdr(), cache: 'no-store' })
    text = await r.text()
  } catch (e) {
    return { status: 0, ms: performance.now() - t, size: 0, url: url.href, text: '', err: e.message }
  }
  let json = null
  try { json = JSON.parse(text) } catch {}
  return { status: r.status, ms: performance.now() - t, size: text.length, cache: r.headers.get('x-cache'), url: url.href, text, json }
}

function build(name) {
  const e = EP[name]
  let path = e.path.replace('{src}', encodeURIComponent(src))
  const q = {}
  for (const k of e.f) {
    const v = String(vals[k] ?? F[k].def ?? '').trim()
    if (path.includes('{' + k + '}')) path = path.replace('{' + k + '}', encodeURIComponent(v))
    else if (v !== '') q[k] = v
  }
  return { path, q }
}

function renderSelects() {
  $('#src').innerHTML = sources.map(s => `<option value="${esc(s.id)}"${s.id === src ? ' selected' : ''}>${esc(s.id)}</option>`).join('')
  $('#src').disabled = !EP[ep].scoped
  $('#ep').innerHTML = Object.keys(EP).map(k => `<option value="${k}"${k === ep ? ' selected' : ''}>${k}</option>`).join('')
}
function renderForm() {
  const f = filters()
  const html = EP[ep].f.map(k => {
    const d = F[k], v = vals[k] ?? d.def ?? ''
    if (d.sel) {
      const opts = f[d.sel] || []
      if (!opts.length) return ''
      return `<label>${d.label}<select data-k="${k}"><option value="">(semua)</option>${opts.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`
    }
    return `<label>${d.label}<input data-k="${k}" value="${esc(v)}" placeholder="${esc(d.ph || '')}" autocomplete="off" autocapitalize="off"></label>`
  }).join('')
  $('#form').innerHTML = html || '<small class="muted">Tanpa parameter.</small>'
}
const setSrc = id => { src = id; store.set('src', id); renderSelects(); renderForm() }
const setEp = k => { ep = k; store.set('ep', k); renderSelects(); renderForm() }
const setVals = o => { Object.assign(vals, o); store.set('vals', vals) }

$('#src').onchange = e => setSrc(e.target.value)
$('#ep').onchange = e => setEp(e.target.value)
$('#form').oninput = e => { const k = e.target.dataset.k; if (k) setVals({ [k]: e.target.value }) }
$('#form').onchange = $('#form').oninput
$('#form').onkeydown = e => { if (e.key === 'Enter') run() }
$('#q').oninput = () => store.set('q', $('#q').value)

let blobs = [], active = 0
const queue = []
function pump() {
  while (active < 4 && queue.length) {
    active++
    loadImg(queue.shift()).finally(() => { active--; pump(); stat() })
  }
}
async function loadImg(img) {
  try {
    const r = await fetch(baseUrl() + img.dataset.src, { headers: hdr() })
    if (!r.ok) throw new Error('HTTP ' + r.status)
    const b = await r.blob()
    if (!b.type.startsWith('image/')) throw new Error('bukan gambar')
    const u = URL.createObjectURL(b)
    blobs.push(u)
    img.src = u
    img.classList.add('ok')
  } catch (e) {
    img.classList.add('bad')
    img.title = 'gagal: ' + e.message
  }
}
function stat() {
  const el = $('#imgstat'); if (!el) return
  const all = document.querySelectorAll('.thumbs img')
  const ok = document.querySelectorAll('.thumbs img.ok').length, bad = document.querySelectorAll('.thumbs img.bad').length
  el.innerHTML = `<span class="ok">${ok} ok</span> · <span class="bad">${bad} gagal</span> · ${all.length - ok - bad} menunggu`
}
function resetImages() { queue.length = 0; blobs.forEach(URL.revokeObjectURL); blobs = [] }
function watchImages() {
  document.querySelectorAll('#res img[data-src]').forEach(i => queue.push(i))
  pump()
}

const imgTag = u => u ? `<img data-src="/api/image?url=${encodeURIComponent(u)}" alt="">` : '<i></i>'

function item(it) {
  const meta = [it.source, it.type, it.status, it.rating != null && '★' + it.rating, it.slug].filter(Boolean).join(' · ')
  const act = it.slug ? ` data-act="open" data-slug="${esc(it.slug)}"${it.source ? ` data-src="${esc(it.source)}"` : ''}` : ''
  return `<div class="item"${act}>${imgTag(it.cover)}<div><b>${esc(it.title || it.slug)}</b><small>${esc(meta)}</small></div></div>`
}
function preview(j) {
  const d = j?.data
  if (!j?.ok || !d) return null
  if (Array.isArray(d.items)) {
    if (!d.items.length) return '<p class="muted">Kosong (0 item)</p>'
    if (typeof d.items[0] === 'string') return `<div class="chs">${d.items.map(g => `<button class="alt" data-act="genre" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>`
    const info = [d.page != null && `hal ${d.page}${d.pages ? '/' + d.pages : ''}`, d.total != null && `total ${d.total}`, d.failed?.length && `gagal: ${d.failed.join(', ')}`].filter(Boolean).join(' · ')
    return `<small>${d.items.length} item${info ? ' · ' + esc(info) : ''}</small>` + d.items.map(item).join('')
  }
  if (d.chapters && d.title) {
    const meta = [d.type, d.status, d.author, d.rating != null && '★' + d.rating, (d.totalChapters ?? d.chapters.length) + ' chapter'].filter(Boolean).join(' · ')
    const cl = d.chapters.slice(0, 80).map(c => `<button class="alt" data-act="chap" data-slug="${esc(d.slug)}" data-ch="${esc(c.slug)}">ch ${esc(c.number)}</button>`).join('')
    return `<div class="head">${imgTag(d.cover)}<div><h3>${esc(d.title)}</h3><small>${esc(meta)}</small><br><small>${esc((d.genres || []).join(', '))}</small></div></div>` +
      `<p>${esc((d.synopsis || '').slice(0, 400))}</p><small>Klik chapter untuk buka${d.chapters.length > 80 ? ` (80 dari ${d.chapters.length})` : ''}</small><div class="chs">${cl}</div>`
  }
  if (d.images && d.proxy) {
    const nav = (s, label) => s ? `<button class="alt" data-act="chap" data-slug="${esc(d.comic)}" data-ch="${esc(s)}">${label}</button>` : ''
    return `<small>${esc(d.comic)} · chapter ${esc(d.chapter)} · ${d.images.length} gambar · <span id="imgstat"></span></small><div class="chs">${nav(d.prev, '◀ prev')}${nav(d.next, 'next ▶')}</div>` +
      `<div class="thumbs">${d.proxy.map(p => `<img data-src="${esc(p)}" alt="">`).join('')}</div>`
  }
  return null
}

function renderResult() {
  if (!last) return
  const r = last, ok = r.status >= 200 && r.status < 300
  const p = preview(r.json)
  const showJson = view === 'json' || p == null
  const MAX = 150000
  let pretty = r.text.length > MAX ? r.text.slice(0, MAX) + '\n… (dipotong)' : r.text
  try { if (r.text.length <= MAX) pretty = JSON.stringify(JSON.parse(r.text), null, 2) } catch {}
  const errMsg = r.err || (!ok && r.json?.error ? `${r.json.error.code}: ${r.json.error.message}` : '')
  resetImages()
  $('#res').hidden = false
  $('#res').innerHTML =
    `<h2>Hasil</h2><div class="bar"><span class="st${ok ? '' : ' bad'}">${r.status || 'ERR'}</span><b>${r.ms.toFixed(0)} ms</b><span>${(r.size / 1024).toFixed(1)} KB</span>` +
    (r.cache ? `<span>${esc(r.cache)}</span>` : '') + `<button class="mini alt" data-act="copy">copy URL</button><span class="url">${esc(r.url)}</span></div>` +
    (errMsg ? `<p class="bad"><b>${esc(errMsg)}</b></p>` : '') +
    (p == null ? '' : `<div class="tabs"><button class="${showJson ? 'alt' : ''}" data-act="tab" data-v="preview">Preview</button><button class="${showJson ? '' : 'alt'}" data-act="tab" data-v="json">JSON</button></div>`) +
    (showJson ? `<pre>${esc(pretty)}</pre>` : p)
  watchImages()
}

$('#res').onclick = e => {
  const t = e.target.closest('[data-act]')
  if (!t) return
  const a = t.dataset.act
  if (a === 'copy') { navigator.clipboard?.writeText(last.url); t.textContent = 'tersalin' }
  else if (a === 'tab') { view = t.dataset.v; renderResult() }
  else if (a === 'open') { if (t.dataset.src) setSrc(t.dataset.src); setVals({ slug: t.dataset.slug }); setEp('comic'); run() }
  else if (a === 'chap') { setVals({ slug: t.dataset.slug, chapter: t.dataset.ch }); setEp('chapter'); run() }
  else if (a === 'genre') { setVals({ genre: t.dataset.g.toLowerCase() }); setEp('browse'); run() }
}

async function run() {
  const e = EP[ep]
  const miss = e.f.find(k => F[k].req && !String(vals[k] ?? '').trim())
  if (e.scoped && !src) return fail('Belum ada sumber — cek Server URL / API key')
  if (miss) return fail(`Parameter "${miss}" wajib diisi`)
  const btn = $('#run'); btn.disabled = true
  try {
    const { path, q } = build(ep)
    view = 'preview'
    last = await call(path, q)
    renderResult()
  } catch (err) { fail(err.message) }
  btn.disabled = false
}
function fail(msg) {
  last = null; resetImages(); $('#res').hidden = false
  $('#res').innerHTML = `<h2>Hasil</h2><p class="bad"><b>${esc(msg)}</b></p>`
}
$('#run').onclick = run

class Skip extends Error {}

async function runGroup(steps, onUpdate) {
  const rows = []
  const ctx = {}
  for (const [name, fn] of steps) {
    const t = performance.now()
    let row
    try { row = { name, res: 'PASS', note: await fn(ctx) } }
    catch (e) { row = { name, res: e instanceof Skip ? 'SKIP' : 'FAIL', note: e.message } }
    row.ms = performance.now() - t
    rows.push(row)
    onUpdate(rows)
  }
  return rows
}

function need(r, cond, msg) {
  if (r.err) throw new Error(r.err)
  if (r.status === 501) throw new Skip('tidak didukung sumber ini')
  if (r.status !== 200 || !r.json?.ok) throw new Error(`HTTP ${r.status} ${r.json?.error?.message || ''}`.trim())
  if (!cond) throw new Error(msg)
}
const info = r => `${r.ms.toFixed(0)}ms${r.cache ? ' · ' + r.cache : ''}`

function serverSteps(q, firstId) {
  return [
    ['GET /health', async () => {
      const r = await call('/health')
      need(r, r.json?.data?.status === 'ok', 'status bukan ok')
      return `uptime ${r.json.data.uptime}s`
    }],
    ['GET /api/sources', async () => {
      const r = await call('/api/sources')
      need(r, r.json?.data?.items?.length, 'tidak ada sumber')
      return r.json.data.items.map(s => s.id).join(', ')
    }],
    ['GET /api/search (semua sumber)', async () => {
      const r = await call('/api/search', { q, limit: 5 })
      need(r, r.json?.data?.items?.length, 'kosong')
      const failed = r.json.data.failed || []
      return `${r.json.data.items.length} item${failed.length ? ' · sumber gagal: ' + failed.join(', ') : ''} · ${info(r)}`
    }],
    ['validasi: tanpa q → 400', async () => {
      const r = await call(`/api/${encodeURIComponent(firstId)}/search`)
      if (r.err) throw new Error(r.err)
      if (r.status !== 400) throw new Error(`harusnya 400, dapat ${r.status}`)
      return r.json?.error?.code || '400'
    }],
    ['validasi: sumber ngawur → 404', async () => {
      const r = await call('/api/tidak-ada/search', { q: 'x' })
      if (r.err) throw new Error(r.err)
      if (r.status !== 404) throw new Error(`harusnya 404, dapat ${r.status}`)
      return r.json?.error?.code || '404'
    }]
  ]
}

function sourceSteps(id, q) {
  const P = `/api/${encodeURIComponent(id)}`
  const list = (path, params, keep) => async c => {
    const r = await call(P + path, params)
    const items = Array.isArray(r.json?.data?.items) ? r.json.data.items : null
    need(r, items?.length, 'kosong')
    if (keep) c.first = items[0]
    return `${items.length} item · ${info(r)}`
  }
  const dep = (c, k, why) => { if (!c[k]) throw new Skip(why) }
  return [
    ['search', list('/search', { q, limit: 10 }, true)],
    ['latest', list('/latest', { page: 1 })],
    ['popular', list('/popular', { limit: 10 })],
    ['browse', list('/browse', { page: 1 })],
    ['genres', list('/genres', {})],
    ['detail', async c => {
      dep(c, 'first', 'search gagal')
      const r = await call(`${P}/comic/${encodeURIComponent(c.first.slug)}`)
      const d = r.json?.data
      need(r, d?.title && d.chapters?.length, 'title/chapter kosong')
      c.ch = d.chapters[d.chapters.length - 1].slug
      return `${d.title} · ${d.chapters.length} chapter · cover ${d.cover ? 'ada' : 'KOSONG'} · ${info(r)}`
    }],
    ['chapter', async c => {
      dep(c, 'ch', 'detail gagal')
      const r = await call(`${P}/chapter/${encodeURIComponent(c.first.slug)}/${encodeURIComponent(c.ch)}`)
      const d = r.json?.data
      need(r, d?.images?.length && d.proxy?.length, 'gambar kosong')
      c.img = d.proxy[0]
      return `ch ${c.ch}: ${d.images.length} gambar · ${info(r)}`
    }],
    ['gambar (proxy)', async c => {
      dep(c, 'img', 'chapter gagal')
      const t = performance.now()
      const r = await fetch(baseUrl() + c.img, { headers: hdr() })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      const b = await r.blob()
      if (!b.type.startsWith('image/')) throw new Error('bukan gambar: ' + b.type)
      return `${b.type} · ${(b.size / 1024).toFixed(0)} KB · ${(performance.now() - t).toFixed(0)}ms`
    }]
  ]
}

const label = { PASS: 'ok', FAIL: 'bad', SKIP: 'skip' }
const groupHTML = (title, rows) =>
  `<table><tr><th colspan="4">${esc(title)}</th></tr>` +
  rows.map(r => `<tr><td class="r ${label[r.res]}">${r.res}</td><td>${esc(r.name)}</td><td class="ms">${r.ms.toFixed(0)} ms</td><td class="${r.res === 'FAIL' ? 'bad' : ''}">${esc(r.note)}</td></tr>`).join('') +
  '</table>'

async function runAll() {
  if (!baseUrl()) return fail('Isi Server URL dulu')
  if (!sources.length) await loadSources()
  if (!sources.length) return
  const q = testQ()
  const groups = [{ title: 'Server', rows: [] }, ...sources.map(s => ({ title: 'Sumber: ' + s.id, rows: [] }))]
  const draw = (done = false) => {
    const all = groups.flatMap(g => g.rows)
    const n = x => all.filter(r => r.res === x).length
    const sum = done
      ? `<div class="sum ${n('FAIL') ? 'bad' : 'ok'}">${n('FAIL') ? 'ADA YANG GAGAL' : 'SEMUA LOLOS'} — ${n('PASS')} pass · ${n('FAIL')} fail · ${n('SKIP')} skip</div>`
      : `<div class="sum">Menjalankan… ${all.length} langkah selesai</div>`
    $('#tests').innerHTML = `<p><small>q = "${esc(q)}"</small></p>` + sum + groups.map(g => groupHTML(g.title, g.rows)).join('')
  }
  const btn = $('#all')
  btn.disabled = true
  draw()
  const jobs = [
    runGroup(serverSteps(q, sources[0].id), rows => { groups[0].rows = rows; draw() }),
    ...sources.map((s, i) => runGroup(sourceSteps(s.id, q), rows => { groups[i + 1].rows = rows; draw() }))
  ]
  await Promise.all(jobs.map(j => j.catch(e => { groups[0].rows.push({ name: 'error', res: 'FAIL', note: e.message, ms: 0 }) })))
  draw(true)
  btn.disabled = false
}
$('#all').onclick = runAll

async function loadSources() {
  store.set('base', $('#base').value.trim()); store.set('key', $('#key').value.trim())
  const base = baseUrl()
  $('#dot').className = ''
  if (!base) { sources = []; renderSelects(); return fail('Isi Server URL (mis. https://server-kamu.com)') }
  const h = await call('/health').catch(() => null)
  $('#dot').className = h && h.status === 200 ? 'ok' : 'bad'
  $('#dot').title = h && h.status === 200 ? `online · uptime ${h.json.data.uptime}s` : 'server tidak terjangkau'
  const r = await call('/api/sources').catch(() => null)
  sources = r?.json?.data?.items || []
  if (!sources.some(s => s.id === src)) src = sources[0]?.id || ''
  renderSelects(); renderForm()
  if (r && r.status === 401) fail('API key salah / belum diisi')
  else if (!sources.length) fail('Tidak bisa memuat sumber' + (r?.err ? ': ' + r.err : ''))
  else if (!last) $('#res').hidden = true
}
let tm
for (const id of ['#base', '#key']) $(id).oninput = () => { clearTimeout(tm); tm = setTimeout(loadSources, 500) }
document.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run() }
renderSelects(); renderForm(); loadSources()
</script>
</body>
</html>
